---
- name: Install Neovim
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Require a Debian-family host
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
        fail_msg: "Neovim playbook currently supports Debian and Ubuntu hosts only"

    - name: Install Neovim
      ansible.builtin.apt:
        name: neovim
        state: present
        update_cache: true
        cache_valid_time: 3600
