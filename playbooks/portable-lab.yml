---
- name: Prepare a portable Debian or Ubuntu lab host
  hosts: portable_lab
  become: true
  gather_facts: true
  vars:
    portable_lab_user: "{{ ansible_user | default(ansible_facts.user_id) }}"
  pre_tasks:
    - name: Require a Debian-family host
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
        fail_msg: "portable-lab supports Debian and Ubuntu hosts only"
  roles:
    - role: common
      tags: [common]
    - role: networking
      tags: [networking]
    - role: nftables
      tags: [nftables]
    - role: containerd
      tags: [containerd]
    - role: incus
      tags: [incus]
    - role: firecracker
      tags: [firecracker]
    - role: monitoring
      tags: [monitoring]
