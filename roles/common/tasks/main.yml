---
- name: Install common host packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure host sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
  loop: "{{ common_sysctl | dict2items }}"

- name: Create lab state directory
  ansible.builtin.file:
    path: /var/lib/portable-lab
    state: directory
    owner: root
    group: root
    mode: "0755"
