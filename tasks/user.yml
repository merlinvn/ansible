- name: Create neo user
  become: true
  ansible.builtin.user:
    name: neo
    shell: /bin/bash
    groups: sudo
    append: true
  tags: "{{ bootstrap_tags }}"

- name: Setup passwordless sudo for neo
  become: true
  lineinfile:
    path: /etc/sudoers.d/neo
    line: "neo ALL=(ALL) NOPASSWD: ALL"
    create: true
    mode: "0440"
  tags: "{{ bootstrap_tags }}"

- name: Install local SSH public key for neo
  become: true
  ansible.posix.authorized_key:
    user: neo
    state: present
    key: >-
      {{ lookup(
        'ansible.builtin.file',
        ssh_public_key_file | default(
          lookup('ansible.builtin.env', 'HOME') ~ '/.ssh/id_ed25519.pub'
        )
      ) }}
  tags: "{{ bootstrap_tags }}"

- name: Ensure sudo group exists
  become: true
  ansible.builtin.group:
    name: sudo
    state: present
  tags: "{{ bootstrap_tags }}"
