- name: Install zsh and git
  become: true
  package:
    name:
      - zsh
      - git
    state: present
  tags: "{{ zsh_tags }}"

- name: Get zsh path
  command: which zsh
  register: zsh_path
  changed_when: false
  tags: "{{ zsh_tags }}"

- name: Change shell for user
  become: true
  user:
    name: "{{ username }}"
    shell: "{{ zsh_path.stdout }}"
  tags: "{{ zsh_tags }}"

- name: Check if oh-my-zsh exists
  stat:
    path: "{{ ansible_facts.user_dir }}/.oh-my-zsh"
  register: ohmyzsh_stat
  tags: "{{ zsh_tags }}"

- name: Install oh-my-zsh
  shell: |
    set -e
    sh -c "$(curl -L https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  when: not ohmyzsh_stat.stat.exists
  tags: "{{ zsh_tags }}"

- name: Clone oh-my-zsh repository
  ansible.builtin.git:
    repo: "https://github.com/ohmyzsh/ohmyzsh.git"
    dest: "{{ ansible_facts.user_dir }}/.oh-my-zsh"
    clone: true
    update: true
  when: not ohmyzsh_stat.stat.exists
  tags: "{{ zsh_tags }}"

- name: Install zsh-autocomplete plugin
  ansible.builtin.git:
    repo: "https://github.com/marlonrichert/zsh-autocomplete.git"
    dest: "{{ ansible_facts.user_dir }}/.oh-my-zsh/plugins/zsh-autocomplete"
  tags: "{{ zsh_tags }}"

- name: Install zsh-syntax-highlighting plugin
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    dest: "{{ ansible_facts.user_dir }}/.oh-my-zsh/plugins/zsh-syntax-highlighting"
  tags: "{{ zsh_tags }}"

- name: Install zsh-autosuggestions plugin
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-autosuggestions.git"
    dest: "{{ ansible_facts.user_dir }}/.oh-my-zsh/plugins/zsh-autosuggestions"
  tags: "{{ zsh_tags }}"

- name: Install fast-syntax-highlighting plugin
  ansible.builtin.git:
    repo: "https://github.com/zdharma-continuum/fast-syntax-highlighting.git"
    dest: "{{ ansible_facts.user_dir }}/.oh-my-zsh/plugins/fast-syntax-highlighting"
  tags: "{{ zsh_tags }}"

- name: Update plugins in .zshrc
  lineinfile:
    path: "{{ ansible_facts.user_dir }}/.zshrc"
    regexp: '^plugins=\(.*\)$'
    line: "plugins=(git zsh-autosuggestions zsh-syntax-highlighting fast-syntax-highlighting docker docker-compose kubectl)"
    backrefs: true
  tags: "{{ zsh_tags }}"

- name: Install starship prompt
  become: true
  ansible.builtin.get_url:
    url: https://starship.rs/install.sh
    dest: /tmp/starship-install.sh
    mode: '0755'
  tags: "{{ zsh_tags }}"

- name: Run starship install script
  become: true
  shell: /tmp/starship-install.sh -y
  args:
    creates: /usr/local/bin/starship
  tags: "{{ zsh_tags }}"

- name: Add starship init to .zshrc
  lineinfile:
    path: "{{ ansible_facts.user_dir }}/.zshrc"
    line: 'eval "$(starship init zsh)"'
    create: true
    insertafter: EOF
  tags: "{{ zsh_tags }}"
