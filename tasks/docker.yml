- name: Check if running in Docker
  command: grep -q docker /proc/1/cgroup 2>/dev/null || echo "not_docker"
  register: docker_cgroup
  changed_when: false
  failed_when: false
  tags: "{{ docker_tags }}"

- name: Install Docker via convenience script
  become: true
  shell: |
    curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
    sh /tmp/get-docker.sh
  when: "'docker' not in docker_cgroup.stdout"
  tags: "{{ docker_tags }}"

- name: Ensure Docker service is started and enabled
  become: true
  systemd:
    name: docker
    state: started
    enabled: true
  tags: "{{ docker_tags }}"

- name: Add user to docker group
  become: true
  user:
    name: "{{ username }}"
    groups: docker
    append: true
  tags: "{{ docker_tags }}"
