- name: Check if lazygit is installed
  ansible.builtin.command: command -v lazygit
  register: lazygit_exists
  changed_when: false
  failed_when: false
  tags: "{{ lazygit_tags }}"

- name: Install lazygit dependencies
  become: true
  ansible.builtin.package:
    name:
      - curl
      - tar
    state: present
  when: lazygit_exists.rc != 0
  tags: "{{ lazygit_tags }}"

- name: Set lazygit architecture
  ansible.builtin.set_fact:
    lazygit_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'arm64', 'arm64': 'arm64'}[ansible_facts['architecture']] | default('unsupported') }}"
  when: lazygit_exists.rc != 0
  tags: "{{ lazygit_tags }}"

- name: Check lazygit architecture support
  ansible.builtin.assert:
    that:
      - lazygit_arch != 'unsupported'
    fail_msg: "lazygit does not have a configured release architecture for {{ ansible_facts['architecture'] }}."
  when: lazygit_exists.rc != 0
  tags: "{{ lazygit_tags }}"

- name: Get latest lazygit version
  ansible.builtin.shell: |
    set -o pipefail
    curl --fail --silent --show-error https://api.github.com/repos/jesseduffield/lazygit/releases/latest \
      | grep '"tag_name":' \
      | sed -E 's/.*"v([^\"]+)".*/\1/'
  args:
    executable: /bin/bash
  register: lazygit_version
  changed_when: false
  when: lazygit_exists.rc != 0
  tags: "{{ lazygit_tags }}"

- name: Download lazygit
  ansible.builtin.get_url:
    url: "https://github.com/jesseduffield/lazygit/releases/download/v{{ lazygit_version.stdout }}/lazygit_{{ lazygit_version.stdout }}_Linux_{{ lazygit_arch }}.tar.gz"
    dest: /tmp/lazygit.tar.gz
    mode: "0644"
  when: lazygit_exists.rc != 0
  tags: "{{ lazygit_tags }}"

- name: Extract lazygit
  ansible.builtin.unarchive:
    src: /tmp/lazygit.tar.gz
    dest: /tmp
    remote_src: true
    include:
      - lazygit
  when: lazygit_exists.rc != 0
  tags: "{{ lazygit_tags }}"

- name: Install lazygit binary
  become: true
  ansible.builtin.copy:
    src: /tmp/lazygit
    dest: /usr/local/bin/lazygit
    mode: "0755"
    remote_src: true
  when: lazygit_exists.rc != 0
  tags: "{{ lazygit_tags }}"
